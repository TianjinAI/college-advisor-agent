services:
  college-advisor:
    image: college-advisor-agent:latest
    container_name: college-advisor
    # Host networking keeps LLM_BASE_URL=http://127.0.0.1:20128/v1 reachable.
    # App process binds 127.0.0.1:3001, so Caddy is the only public entry point.
    network_mode: host
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LLM_BASE_URL=http://127.0.0.1:20128/v1
    volumes:
      - ./data:/app/server/data:rw
      - ./client/dist:/app/client/dist:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
